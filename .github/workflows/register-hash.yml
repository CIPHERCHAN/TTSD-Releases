name: Register release hash

# Fires whenever a release is published, OR whenever an existing release is
# edited (which is what happens when you replace the .exe asset on the
# TTSD-V3 release while keeping the same download URL — that's an "edited"
# event, not a new "published" release, since the release itself already
# existed).
on:
  release:
    types: [published, edited]

jobs:
  register-hash:
    runs-on: windows-latest
    steps:
      - name: Locate the release asset
        id: locate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetName = "T3CHS.Transsion.Software.exe"
          $assets = gh api "${{ github.event.release.assets_url }}" | ConvertFrom-Json
          $target = $assets | Where-Object { $_.name -eq $assetName }

          if (-not $target) {
            Write-Error "No asset named '$assetName' found on this release. Available assets: $($assets.name -join ', ')"
            exit 1
          }

          Write-Host "Found asset: $($target.name) ($([math]::Round($target.size / 1MB, 1)) MB)"
          echo "download_url=$($target.browser_download_url)" >> $env:GITHUB_OUTPUT

      - name: Download the asset
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ steps.locate.outputs.download_url }}" -OutFile "app.exe"

      - name: Compute hash and read embedded version
        id: info
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -Path "app.exe").Hash.ToLower()

          # Read the version baked into the .exe itself (Windows PE version
          # resource) rather than trusting the release tag/title — the tag
          # on this repo is a fixed channel name ("TTSD-V3"), not the app's
          # actual version, and release titles can be typo'd or forgotten.
          # The embedded FileVersion is the same value the app itself
          # already reports (e.g. in godzilla_check/session logging), so
          # this keeps a single source of truth.
          $versionInfo = (Get-Item "app.exe").VersionInfo
          $version = $versionInfo.FileVersion
          if ([string]::IsNullOrWhiteSpace($version)) { $version = $versionInfo.ProductVersion }

          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "Could not read a FileVersion or ProductVersion from app.exe. Is the version resource set in the project's AssemblyInfo/csproj?"
            exit 1
          }

          Write-Host "SHA256:   $hash"
          Write-Host "Version:  $version"
          echo "hash=$hash"       >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Register with TTSD-Auth
        shell: pwsh
        run: |
          $body = @{
            ciSecret = "${{ secrets.TTSD_ADMIN_SECRET }}"
            hash     = "${{ steps.info.outputs.hash }}"
            version  = "${{ steps.info.outputs.version }}"
          } | ConvertTo-Json

          try {
            $response = Invoke-RestMethod -Uri "${{ secrets.TTSD_APPSCRIPT_URL }}" -Method Post -Body $body -ContentType "application/json"
          } catch {
            Write-Error "Request to TTSD-Auth failed: $_"
            exit 1
          }

          Write-Host "Response: $($response | ConvertTo-Json -Compress)"

          if (-not $response.ok) {
            Write-Error "Registration rejected: $($response.code) — $($response.message)"
            exit 1
          }

          Write-Host "✅ $($response.message)"
